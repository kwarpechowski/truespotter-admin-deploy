[package]
name = "truespotter-admin"
version = "0.1.0"
edition = "2021"
description = "TrueSpotter Rust admin service — admin login (JWT), chat sessions, products, web reviews, stats, Temporal workflows (read-only admin surface)"
license = "Proprietary"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["http1", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
